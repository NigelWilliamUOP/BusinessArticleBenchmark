name: Validate benchmark

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_manifests.py
      - run: python scripts/validate_forecast_inputs.py
      - run: python scripts/validate_synthetic_inputs.py
      - run: python scripts/build_synthetic_index.py --output /tmp/frontier_index.json
      - run: python -m py_compile scripts/validate_manifests.py scripts/validate_results.py scripts/validate_forecast_inputs.py scripts/forecast_capability_share.py scripts/validate_synthetic_inputs.py scripts/build_synthetic_index.py
